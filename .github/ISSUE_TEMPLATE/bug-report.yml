name: Bug Report
description: Report a bug or unintended behavior found by human or validation agent.
title: "[Bug]: <Short description>"
labels: ["bug"]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the bug. What was the unexpected behavior?
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can a maintainer or the owner reproduce this bug?
      value: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any crash logs or terminal output here.
      render: shell
    validations:
      required: false
