name: Sync Reference Repos

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Sync reference gitlinks
        run: bash scripts/sync-reference-gitlinks.sh

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/reference-repo-sync
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No reference repo updates found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"
          git commit -m "chore: sync reference repo gitlinks"
          git push --force-with-lease origin "$BRANCH_NAME"

          if gh pr view "$BRANCH_NAME" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH_NAME" \
              --title "chore: sync reference repo gitlinks" \
              --body "Automated update of tracked reference-project gitlinks to their upstream HEAD commits."
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "chore: sync reference repo gitlinks" \
              --body "Automated update of tracked reference-project gitlinks to their upstream HEAD commits."
          fi
