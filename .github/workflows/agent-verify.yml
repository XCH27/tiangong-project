name: Agent Verify (CI)
on:
  pull_request:
  push:
    branches: [ "main", "work/fresh-base-spine" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate doc contracts
        run: python3 scripts/validate-doc-contracts.py

      # Keep in sync with `app/package.json` -> packageManager/engines.
      # 1.3.13+ is required: `validate:dev` runs the real suite through
      # `bun test --isolate`, and `validate:quick` uses `--changed`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run validation suite
        working-directory: ./app
        run: bun run validate:ci
