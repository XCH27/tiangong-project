name: Agent Verify (CI)
on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./app
        run: bun install

      - name: Typecheck all modules
        run: ./scripts/craft.sh run typecheck:all || echo "Typecheck failed, but continuing for demonstration (modify as needed)"

      - name: Fleet Verify Script
        run: ./scripts/fleet-verify.sh || echo "Verify script failed or missing targets"
