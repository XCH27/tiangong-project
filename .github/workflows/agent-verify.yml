name: Agent Verify (CI)
on:
  pull_request:
  push:
    # Until 2026-09-20 this list named only "main" and "work/fresh-base-spine", neither of
    # which has been the branch anyone commits to since 2026-09-10 — so every push to the
    # real working line ran no CI at all. "work/**" covers the working lines by convention.
    branches: [ "main", "work/**" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate doc contracts
        run: python3 scripts/validate-doc-contracts.py

      - name: Check out the Craft comparison reference
        uses: actions/checkout@v4
        with:
          repository: craft-ai-agents/craft-agents-oss
          ref: v0.13.4
          path: .fleet-upstream
          persist-credentials: false

      - name: Verify immutable reference revision
        run: test "$(git -C .fleet-upstream rev-parse HEAD)" = b2d6c8aabdfdc96416eea9debd6756ae6d3c0db9

      # The repository verifier uses `bun test --isolate` (requires Bun 1.3.13+).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run validation suite
        run: bash scripts/fleet-verify.sh
        env:
          FLEET_UPSTREAM_DIR: ${{ github.workspace }}/.fleet-upstream

      - name: Check localization
        working-directory: ./app
        run: bun run lint:i18n:parity && bun run lint:i18n:sorted && bun run lint:i18n:coverage
